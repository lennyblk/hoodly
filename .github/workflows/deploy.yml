name: Deploy Hoodly

on:
  push:
    branches: [main]

env:
  API_IMAGE: ghcr.io/${{ github.repository_owner }}/hoodly-api
  WEB_IMAGE: ghcr.io/${{ github.repository_owner }}/hoodly-web

jobs:
  build-push-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API
        uses: docker/build-push-action@v6
        with:
          context: ./api
          target: production
          push: true
          tags: ${{ env.API_IMAGE }}:latest

      - name: Build and push Web
        uses: docker/build-push-action@v6
        with:
          context: ./web
          target: production
          push: true
          tags: ${{ env.WEB_IMAGE }}:latest
          build-args: |
            VITE_API_URL=https://api.hoodly.lennyblk.dev

      - name: Deploy on server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            echo ${{ secrets.GHCR_PAT }} | docker login ghcr.io -u ${{ github.repository_owner }} --password-stdin
            docker compose -f /root/compose/hoodly/docker-compose.yml pull
            docker compose -f /root/compose/hoodly/docker-compose.yml up -d
