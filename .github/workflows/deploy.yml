name: Deploy to production

on:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install API dependencies
        run: cd api && npm ci
      - name: Run tests
        run: cd api && npx jest --no-cache

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /root/hoodly
            git pull origin main
            VITE_API_URL=${{ secrets.VITE_API_URL }} docker compose -f docker-compose.prod.yaml up -d --build
            docker exec hoodly-api node dist/seed.js
            docker restart caddy
