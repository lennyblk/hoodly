services:
  web:
    build:
      context: ./web
      dockerfile: Dockerfile
      target: production
      args:
        VITE_API_URL: ${VITE_API_URL}
    container_name: hoodly-web
    restart: unless-stopped
    networks:
      - proxy
      - default

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
      target: production
    container_name: hoodly-api
    restart: unless-stopped
    env_file: .env.prod
    volumes:
      - sqlite_data:/app/data
    networks:
      - proxy
      - default
    depends_on:
      - mongodb
      - neo4j

  mongodb:
    image: mongo:7
    container_name: hoodly-mongo
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: hoodly
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: root

  neo4j:
    image: neo4j:5
    container_name: hoodly-neo4j
    restart: unless-stopped
    volumes:
      - neo4j_data:/data
    environment:
      NEO4J_AUTH: neo4j/password

volumes:
  mongo_data:
  neo4j_data:
  sqlite_data:

networks:
  proxy:
    external: true
    name: proxy
